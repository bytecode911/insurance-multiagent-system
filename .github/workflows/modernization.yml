name: Modernization Check
on:
  pull_request:
    branches: [main]
jobs:
  upgrade-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Upgrade Agent
        run: npx tsx agents/upgradeAgent.ts
